<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Mammoth Bots: Four opinionated geometric robots that debate your dilemmas and reach a collective verdict." />
    <title>Mammoth Bots — Four Autonomous Decision Robots</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="bots-canvas"></canvas>

    <header class="top-bar">
      <div class="brand-title">
        <span class="brand-mark">MB-04</span>
        <span class="brand-text">mammoth bots</span>
        <span class="brand-sub">interactive deliberation engine</span>
      </div>
      <div class="top-actions">
        <button id="sound-toggle" class="text-btn" type="button" title="Toggle audio feedback">sound: on</button>
        <button id="amnesia-btn" class="text-btn" type="button" title="Wipe bot memory">reset memories</button>
        <button id="nerd-toggle" class="nerd-btn" type="button" aria-pressed="false" title="Toggle nerd mode (?)">[?] telemetry</button>
      </div>
    </header>

    <div id="nerd-panel" class="nerd-panel" aria-hidden="true"></div>

    <main class="input-container" id="input-container">
      <div class="dilemma-chips" id="dilemma-chips">
        <button type="button" class="dilemma-pill" data-prompt="Should I quit my job and open a bakery in Lisbon?">Open a Lisbon bakery?</button>
        <button type="button" class="dilemma-pill" data-prompt="Refactor the entire monolith this weekend or go camping?">Refactor monolith or camp?</button>
        <button type="button" class="dilemma-pill" data-prompt="Adopt a third senior rescue dog despite a small studio?">Adopt 3rd rescue dog?</button>
      </div>
      <form id="question-form" class="input-form">
        <label for="question-input" class="sr-only">Type a genuine dilemma for the robots to debate</label>
        <input
          type="text"
          id="question-input"
          class="question-input"
          placeholder="State your dilemma or choice here…"
          maxlength="100"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="input-meta">
          <span id="char-counter" class="char-counter">0</span>
          <button type="submit" class="submit-btn" aria-label="Submit question">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </form>
      <div id="input-hint" class="input-hint" aria-live="polite"></div>
    </main>

    <!-- Semantic fallback and screen-reader context for genuine document text -->
    <noscript>
      <section class="noscript-context">
        <h1>Mammoth Bots: Deliberation Engine</h1>
        <p>Four autonomous geometric robots (Circle, Triangle, Diamond, Squircle) vote with weighted probability to resolve real human questions.</p>
      </section>
    </noscript>

    <div id="toast-container" class="toast-container" aria-live="assertive"></div>
    <div id="a11y-result" class="sr-only" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
