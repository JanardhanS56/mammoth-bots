<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mammoth Bots</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="bots-canvas"></canvas>

    <header class="top-bar">
      <div class="brand-title">
        <span class="brand-dot"></span>
        <span>mammoth bots</span>
      </div>
      <div class="top-actions">
        <button id="sound-toggle" class="text-btn" type="button" title="Toggle audio feedback">sound: on</button>
        <button id="amnesia-btn" class="text-btn" type="button" title="Wipe bot memory">forget</button>
        <button id="nerd-toggle" class="nerd-btn" type="button" aria-pressed="false" title="Toggle nerd mode (?)">[?]</button>
      </div>
    </header>

    <div id="nerd-panel" class="nerd-panel" aria-hidden="true"></div>

    <main class="input-container" id="input-container">
      <div class="dilemma-chips" id="dilemma-chips">
        <button type="button" class="dilemma-pill" data-prompt="Should I adopt 3 cats?">Should I adopt 3 cats?</button>
        <button type="button" class="dilemma-pill" data-prompt="Coffee or matcha?">Coffee or matcha?</button>
        <button type="button" class="dilemma-pill" data-prompt="Is pizza a breakfast food?">Is pizza breakfast?</button>
      </div>
      <form id="question-form" class="input-form">
        <label for="question-input" class="sr-only">Ask the robots a question</label>
        <input
          type="text"
          id="question-input"
          class="question-input"
          placeholder="Ask a question…"
          maxlength="100"
          autocomplete="off"
          spellcheck="false"
        />
        <div class="input-meta">
          <span id="char-counter" class="char-counter">0</span>
          <button type="submit" class="submit-btn" aria-label="Submit question">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </form>
      <div id="input-hint" class="input-hint" aria-live="polite"></div>
    </main>

    <div id="toast-container" class="toast-container" aria-live="assertive"></div>
    <div id="a11y-result" class="sr-only" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
